name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/API/Dockerfile
          load: true
          tags: |
            ghcr.io/mohamadrahmani/customerreturncrm-api:${{ github.sha }}
            ghcr.io/mohamadrahmani/customerreturncrm-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/API/Dockerfile.migration
          load: true
          tags: |
            ghcr.io/mohamadrahmani/customerreturncrm-migration:${{ github.sha }}
            ghcr.io/mohamadrahmani/customerreturncrm-migration:latest
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/Web/Dockerfile
          load: true
          tags: |
            ghcr.io/mohamadrahmani/customerreturncrm-web:${{ github.sha }}
            ghcr.io/mohamadrahmani/customerreturncrm-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync images and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          SSH_OPTS=(
            -i ~/.ssh/deploy_key
            -o IdentitiesOnly=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
            -o StrictHostKeyChecking=accept-new
          )

          ssh "${SSH_OPTS[@]}" "$VPS_USER@$VPS_HOST" \
            'cd /opt/CustomerReturnCRM && git pull --ff-only origin main'

          echo "Preparing Docker image archive..."
          docker save \
            "ghcr.io/mohamadrahmani/customerreturncrm-api:$IMAGE_TAG" \
            "ghcr.io/mohamadrahmani/customerreturncrm-migration:$IMAGE_TAG" \
            "ghcr.io/mohamadrahmani/customerreturncrm-web:$IMAGE_TAG" \
            | gzip -1 > customerreturncrm-images.tar.gz

          echo "Docker image archive size:"
          ls -lh customerreturncrm-images.tar.gz

          echo "Creating remote transfer directory..."
          ssh "${SSH_OPTS[@]}" "$VPS_USER@$VPS_HOST" \
            'mkdir -p /opt/CustomerReturnCRM/.deploy'

          echo "Transferring Docker images to VPS..."
          for attempt in 1 2 3; do
            if rsync -av --partial --append-verify --progress \
              -e "ssh ${SSH_OPTS[*]}" \
              customerreturncrm-images.tar.gz \
              "$VPS_USER@$VPS_HOST:/opt/CustomerReturnCRM/.deploy/customerreturncrm-images.tar.gz"; then
              break
            fi

            if [ "$attempt" -eq 3 ]; then
              echo "Image transfer failed after 3 attempts."
              exit 1
            fi

            echo "Transfer interrupted; retrying (attempt $((attempt + 1))/3)..."
            sleep 5
          done

          echo "Loading Docker images on VPS..."
          ssh "${SSH_OPTS[@]}" "$VPS_USER@$VPS_HOST" << EOF
          set -euo pipefail
          cd /opt/CustomerReturnCRM

          gunzip -c .deploy/customerreturncrm-images.tar.gz | docker load
          rm -f .deploy/customerreturncrm-images.tar.gz

          export IMAGE_TAG='${{ github.sha }}'

          docker compose run --rm --pull never migration
          docker compose up -d --pull never --no-build --force-recreate --remove-orphans api web

          docker image prune -f
          EOF

          rm -f customerreturncrm-images.tar.gz
