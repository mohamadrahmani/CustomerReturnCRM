name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/API/Dockerfile
          push: true
          tags: |
            ghcr.io/mohamadrahmani/customerreturncrm-api:${{ github.sha }}
            ghcr.io/mohamadrahmani/customerreturncrm-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push migration
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/API/Dockerfile.migration
          push: true
          tags: |
            ghcr.io/mohamadrahmani/customerreturncrm-migration:${{ github.sha }}
            ghcr.io/mohamadrahmani/customerreturncrm-migration:latest
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/Web/Dockerfile
          push: true
          tags: |
            ghcr.io/mohamadrahmani/customerreturncrm-web:${{ github.sha }}
            ghcr.io/mohamadrahmani/customerreturncrm-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/CustomerReturnCRM
            git pull --ff-only origin main
            printf '%s' "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USERNAME }}" --password-stdin
            export IMAGE_TAG="${{ github.sha }}"
            docker compose pull api web migration
            docker compose run --rm migration
            docker compose up -d --no-build --force-recreate --remove-orphans api web
            docker image prune -f
