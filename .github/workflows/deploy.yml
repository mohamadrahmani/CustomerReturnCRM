name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-images:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/API/Dockerfile
          load: true
          tags: |
            ghcr.io/mohamadrahmani/customerreturncrm-api:${{ github.sha }}
            ghcr.io/mohamadrahmani/customerreturncrm-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build migration image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/API/Dockerfile.migration
          load: true
          tags: |
            ghcr.io/mohamadrahmani/customerreturncrm-migration:${{ github.sha }}
            ghcr.io/mohamadrahmani/customerreturncrm-migration:latest
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/Web/Dockerfile
          load: true
          tags: |
            ghcr.io/mohamadrahmani/customerreturncrm-web:${{ github.sha }}
            ghcr.io/mohamadrahmani/customerreturncrm-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Prepare SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync images and deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          SSH_OPTS=(
            -i ~/.ssh/deploy_key
            -o IdentitiesOnly=yes
            -o ConnectTimeout=30
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=10
            -o StrictHostKeyChecking=accept-new
          )

          ssh "${SSH_OPTS[@]}" "$VPS_USER@$VPS_HOST" \
            'cd /opt/CustomerReturnCRM && git pull --ff-only origin main'

          echo "Transferring Docker images to VPS..."

          docker save \
            "ghcr.io/mohamadrahmani/customerreturncrm-api:$IMAGE_TAG" \
            "ghcr.io/mohamadrahmani/customerreturncrm-migration:$IMAGE_TAG" \
            "ghcr.io/mohamadrahmani/customerreturncrm-web:$IMAGE_TAG" \
            | gzip -1 \
            | ssh "${SSH_OPTS[@]}" \
                "$VPS_USER@$VPS_HOST" \
                'set -o pipefail; gunzip | docker load'

          echo "Docker images loaded successfully on VPS."


