name: Deploy Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/API/Dockerfile
          push: true
          tags: |
            ghcr.io/mohamadrahmani/customerreturncrm-api:${{ github.sha }}
            ghcr.io/mohamadrahmani/customerreturncrm-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push migration
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/API/Dockerfile.migration
          push: true
          tags: |
            ghcr.io/mohamadrahmani/customerreturncrm-migration:${{ github.sha }}
            ghcr.io/mohamadrahmani/customerreturncrm-migration:latest
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration

      - name: Build and push Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Docker/Web/Dockerfile
          push: true
          tags: |
            ghcr.io/mohamadrahmani/customerreturncrm-web:${{ github.sha }}
            ghcr.io/mohamadrahmani/customerreturncrm-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key             -o IdentitiesOnly=yes             -o ConnectTimeout=30             "$VPS_USER@$VPS_HOST" << EOF
          set -e
          cd /opt/CustomerReturnCRM
          git pull --ff-only origin main
          printf '%s' '$GHCR_TOKEN' | docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin
          export IMAGE_TAG='$IMAGE_TAG'
          docker compose pull api web migration
          docker compose run --rm migration
          docker compose up -d --no-build --force-recreate --remove-orphans api web
          docker image prune -f
          EOF