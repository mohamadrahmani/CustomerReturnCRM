services:

  migration:
    build:
      context: .
      dockerfile: Docker/API/Dockerfile.migration
    container_name: customerreturncrm-migration
    environment:
      ConnectionStrings__DefaultConnection: "Server=185.8.174.94,1433;Database=CustomerReturnCRM;User Id=BmsDbUser;Password=${DB_PASSWORD};TrustServerCertificate=True;Connection Timeout=30;"

  api:
    build:
      context: .
      dockerfile: Docker/API/Dockerfile
    container_name: customerreturncrm-api
    environment:
      ConnectionStrings__DefaultConnection: "Server=185.8.174.94,1433;Database=CustomerReturnCRM;User Id=BmsDbUser;Password=${DB_PASSWORD};TrustServerCertificate=True;Connection Timeout=30;"
      Jwt__Key: "${JWT_KEY}"
      Sms__Provider: "SmsIr"
      SMSApiKey: "${SMSApiKey}"
      SMSLineNumber: "${SMSLineNumber}"
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build:
      context: .
      dockerfile: Docker/Web/Dockerfile
    container_name: customerreturncrm-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: "/api"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
